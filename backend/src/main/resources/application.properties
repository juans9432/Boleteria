server.address=127.0.0.1
spring.datasource.url=${BOLETERIA_DB_URL:jdbc:oracle:thin:@//localhost:1521/XEPDB1}
spring.datasource.username=${BOLETERIA_DB_USER:BOLETERIA_FINAL}
spring.datasource.password=${BOLETERIA_DB_PASSWORD}
spring.sql.init.mode=never

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${BOLETERIA_COOKIE_SECURE:false}
server.servlet.session.timeout=30m
